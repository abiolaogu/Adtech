# SonarQube Project Configuration

sonar.projectKey=adtech-platform
sonar.projectName=AdTech/MarTech Platform
sonar.projectVersion=1.0.0

# Source code
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=backend/tsconfig.json,frontend/tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.spec.ts

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**,**/__tests__/**

# Quality gates
sonar.qualitygate.wait=true

# Code duplications
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts
