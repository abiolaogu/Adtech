# Turbospike (Aerospike) Configuration
# Optimized for AdTech Platform - High-Performance Ad Serving

service {
    user root
    group root
    paxos-single-replica-limit 1
    pidfile /var/run/aerospike/asd.pid
    service-threads 16
    transaction-queues 16
    transaction-threads-per-queue 8
    proto-fd-max 15000

    # Enable cluster management
    cluster-name adtech-turbospike
}

logging {
    file /var/log/aerospike/aerospike.log {
        context any info
    }
}

network {
    service {
        address any
        port 3000

        # Increase max connections for high throughput
        access-address any
    }

    heartbeat {
        mode mesh
        port 3002

        # Mesh seed addresses (will be added by docker-compose)
        mesh-seed-address-port ${MESH_SEED_ADDRESS:-127.0.0.1} 3002

        interval 150
        timeout 10
    }

    fabric {
        port 3001
    }

    info {
        port 3003
    }
}

# AdTech Namespace - Optimized for real-time ad serving
namespace adtech {
    # Memory storage for ultra-low latency
    replication-factor 2
    memory-size 8G
    default-ttl 0  # Never expire (we manage TTL per record)

    # Enable strong consistency
    strong-consistency false

    # Storage configuration
    storage-engine memory

    # Enable secondary indexes for fast queries
    # sindex-enable true

    # Performance tuning
    high-water-disk-pct 70
    high-water-memory-pct 70
    stop-writes-pct 90
}

# Hot data namespace - For impression tracking
namespace impressions {
    replication-factor 2
    memory-size 16G
    default-ttl 2592000  # 30 days

    storage-engine memory

    # Enable persistence to SSD
    # storage-engine device {
    #     file /opt/aerospike/data/impressions.dat
    #     filesize 100G
    #     write-block-size 128K
    # }
}

# Analytics namespace - For aggregated metrics
namespace analytics {
    replication-factor 2
    memory-size 4G
    default-ttl 7776000  # 90 days

    storage-engine memory
}
