version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: adtech
      POSTGRES_PASSWORD: password
      POSTGRES_DB: adtech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adtech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - adtech-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://adtech:password@postgres:5432/adtech
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-prod
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adtech-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - adtech-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  adtech-network:
    driver: bridge
